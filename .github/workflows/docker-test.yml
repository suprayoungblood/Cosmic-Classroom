name: Docker Test CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Create .env file
      run: |
        echo "OPENAI_API_KEY=test-api-key" >> .env
        echo "JWT_SECRET=test-jwt-secret" >> .env
    
    - name: Build test containers
      run: docker-compose -f docker-compose.test.yml build
    
    - name: Run server tests
      run: |
        docker-compose -f docker-compose.test.yml run --rm server-test
    
    - name: Run client tests
      run: |
        docker-compose -f docker-compose.test.yml run --rm client-test
    
    - name: Generate coverage reports
      run: |
        docker-compose -f docker-compose.test.yml run --rm server-coverage
        docker-compose -f docker-compose.test.yml run --rm client-coverage
    
    - name: Upload server coverage
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: server-coverage
        path: server/coverage
    
    - name: Upload client coverage
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: client-coverage
        path: client/coverage
    
    - name: Clean up
      if: always()
      run: docker-compose -f docker-compose.test.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: docker-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build production images
      run: |
        docker-compose build
    
    - name: Test production build startup
      run: |
        docker-compose up -d
        sleep 10
        docker-compose ps
        curl -f http://localhost:3000/api/health || exit 1
        curl -f http://localhost:5173 || exit 1
    
    - name: Clean up
      if: always()
      run: docker-compose down -v