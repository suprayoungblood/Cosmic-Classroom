name: Test CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cosmic_classroom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
    
    - name: Create test environment file
      working-directory: ./server
      run: |
        echo "NODE_ENV=test" >> .env.test
        echo "DB_HOST=localhost" >> .env.test
        echo "DB_USER=postgres" >> .env.test
        echo "DB_PASSWORD=postgres" >> .env.test
        echo "DB_NAME=cosmic_classroom_test" >> .env.test
        echo "DB_PORT=5432" >> .env.test
        echo "JWT_SECRET=test-jwt-secret-key" >> .env.test
        echo "OPENAI_API_KEY=test-api-key" >> .env.test
    
    - name: Run server tests
      working-directory: ./server
      run: npm test -- --ci --coverage
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: cosmic_classroom_test
        DB_PORT: 5432
        JWT_SECRET: test-jwt-secret-key
        OPENAI_API_KEY: test-api-key
    
    - name: Upload server coverage
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: server-coverage
        path: server/coverage

  test-client:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci
    
    - name: Run client tests
      working-directory: ./client
      run: npm run test:run -- --coverage
    
    - name: Upload client coverage
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: client-coverage
        path: client/coverage

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
    
    - name: Run server linting
      working-directory: ./server
      run: npm run lint
    
    - name: Check server TypeScript
      working-directory: ./server
      run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: [test-server, test-client, lint]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Build server
      working-directory: ./server
      run: |
        npm ci
        npm run build
    
    - name: Build client
      working-directory: ./client
      run: |
        npm ci
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          server/dist
          client/dist